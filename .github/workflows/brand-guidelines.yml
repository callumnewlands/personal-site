name: Brand guidelines

on:
  pull_request:
    paths:
      - docs/brand-guidelines*
      - docs/brand-guidelines-source/**
      - .github/workflows/brand-guidelines.yml
  push:
    branches: [main]
    paths:
      - docs/brand-guidelines*
      - docs/brand-guidelines-source/**
      - .github/workflows/brand-guidelines.yml

jobs:
  build:
    name: Build brand guidelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm guidelines
      # The markdown comes out the same every time, so it has to match
      - name: Check the markdown is up to date
        run: git diff --exit-code docs/brand-guidelines.md || (echo "::error::brand-guidelines.md is out of date. Run pnpm guidelines and commit it." && exit 1)
      # The PDF differs byte for byte between machines, so only check it was rebuilt
      - name: Check the PDF was rebuilt
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -q '^docs/brand-guidelines-source/index.html$' && ! echo "$changed" | grep -q '^docs/brand-guidelines.pdf$'; then
            echo "::error::index.html changed but brand-guidelines.pdf didn't. Run pnpm guidelines and commit it."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: brand-guidelines
          path: |
            docs/brand-guidelines.pdf
            docs/brand-guidelines.md
