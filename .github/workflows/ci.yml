name: CI

on:
  pull_request:
  push:
    branches: [main, redesign]

permissions:
  contents: read
  # needed by paths-filter
  pull-requests: read

# Only PR runs share a group, so pushes never cancel or queue behind each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Skip the site checks for docs-only changes
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            site:
              - "**"
              - "!docs/**"

  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:unit

  e2e:
    name: Playwright
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report

  lighthouse:
    name: Lighthouse (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lhci
        env:
          LIGHTHOUSE_SHARD: ${{ strategy.job-index }}
          LIGHTHOUSE_SHARDS: ${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports-${{ matrix.shard }}
          path: .lighthouseci
          include-hidden-files: true

  lighthouse-summary:
    name: Lighthouse summary
    needs: [changes, lighthouse]
    if: always() && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: lighthouse-reports-*
          path: reports
      - run: node scripts/lighthouse-summary.mjs reports/*

  # Rulesets require this, as skipped matrix jobs never report their shard names
  ci-passed:
    name: CI passed
    needs: [changes, lint, e2e, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
