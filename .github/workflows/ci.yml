name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Docs-only changes skip the build, Playwright and Lighthouse
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            site:
              - "**"
              - "!docs/**"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  e2e:
    name: Playwright
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report

  lighthouse:
    name: Lighthouse (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lhci
        env:
          LIGHTHOUSE_SHARD: ${{ strategy.job-index }}
          LIGHTHOUSE_SHARDS: ${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports-${{ matrix.shard }}
          path: .lighthouseci
          include-hidden-files: true

  lighthouse-summary:
    name: Lighthouse summary
    needs: [changes, lighthouse]
    if: always() && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: lighthouse-reports-*
          path: reports
      - run: node scripts/lighthouse-summary.mjs reports/*
